# 包含到 evanlink.cn 的 HTTPS server 块，不作用于 /api 或 /agent-api。
location = /index.html {
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
}
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/x-javascript image/svg+xml;
}
