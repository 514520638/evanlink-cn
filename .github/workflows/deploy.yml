name: Build and deploy blog
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: frontend-${{ github.event_name }}-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HOST: 62.234.72.18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Configure deployment SSH
        timeout-minutes: 2
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS repository secret'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/deploy > /dev/null || { echo 'DEPLOY_SSH_KEY must contain an unencrypted OpenSSH private key'; exit 1; }
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts > /dev/null || { echo 'DEPLOY_KNOWN_HOSTS must contain the verified server key for 62.234.72.18'; exit 1; }
          printf '%s\n' 'Host *' '  ConnectTimeout 15' '  ConnectionAttempts 1' '  ServerAliveInterval 15' '  ServerAliveCountMax 4' '  IdentitiesOnly yes' > ~/.ssh/config
          timeout 30s ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$HOST" 'echo SSH_READY'
      - name: Upload frontend release
        id: upload
        timeout-minutes: 32
        run: |
          head=$(timeout 30s git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo 'Newer commit exists; skipping stale deployment.'; exit 0; fi
          tar -czf frontend.tar.gz -C dist .
          remote="/tmp/evanlink-ci-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$HOST" "mkdir -m 700 '$remote'"
          bash deploy/ci-upload.sh "$remote" frontend.tar.gz deploy/ci-deploy.sh deploy/ci-nginx-cache.sh deploy/nginx-frontend-cache.conf
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Deploy and verify
        if: steps.upload.outputs.ready == 'true'
        timeout-minutes: 20
        run: |
          remote="/tmp/evanlink-ci-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$HOST" "bash '$remote/ci-deploy.sh' '$remote' '$GITHUB_SHA' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'"
